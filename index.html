function fuseTarget(x,y){
  if(!x||!y)return null;
  if(x.sp===y.sp)return{sp:x.sp,kind:'same',el:null,cost:100,lv:1};
  const r=PET_RECIPES.find(r=>(r.a===x.sp&&r.b===y.sp)||(r.a===y.sp&&r.b===x.sp));
  if(!r)return null;
  if(Math.min(x.lv,y.lv)<r.minLv)return{err:'需要双方都达到 Lv'+r.minLv,sp:r.sp};
  return{sp:r.sp,kind:'recipe',el:r.el,cost:r.cost,lv:Math.max(1,Math.floor(Math.min(x.lv,y.lv)/3))};
}

function parseCode(text){
  try{
    text=String(text||'').trim();if(!text.startsWith(CODE_PREFIX))return{err:'这不是有效的挑战码（应以 '+CODE_PREFIX+' 开头）'};
    const rest=text.slice(CODE_PREFIX.length),k=rest.indexOf('-'),hash=rest.slice(0,k),raw=rest.slice(k+1);
    if(k<0||codeHash(raw)!==hash)return{err:'挑战码校验失败，可能复制不完整'};
    const arr=JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(!Array.isArray(arr)||!arr.length||arr.length>3)return{err:'挑战码里的队伍数据不对'};
    const ints=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b,out=[];
    for(const d of arr){
      const[sp,lv,el,nat,ab,q,g,ap,sk,ev,at]=d;
      if(!ints(sp,0,SP.length-1)||!ints(lv,1,60)||!ints(el,0,4)||!ints(nat,0,5)||!ints(ab,0,5)||!ints(q,0,2))return{err:'挑战码里有无效的宠物数据'};
      if(typeof g!=='number'||g<.5||g>1.6)return{err:'挑战码里有无效的成长率'};
      if(!Array.isArray(ap)||ap.length!==5||ap.some((v,i)=>typeof v!=='number'||v<SP[sp].b[i]*.5||v>SP[sp].b[i]*1.8))return{err:'挑战码里有无效的资质'};
      const e=EVO_SP.has(sp)&&ints(ev,0,2)?ev:0;
      const skills=(Array.isArray(sk)?sk:[]).filter(x=>SKN.includes(x)&&canLearn(sp,x)).slice(0,6);
      let pts=Array.isArray(at)&&at.length===5?at.map(v=>Number.isFinite(v)?Math.max(10,Math.round(v)):10):[10,10,10,10,10];
      const budget=50+5*lv+10*e;let sum=pts.reduce((a,b)=>a+b,0);
      if(sum>budget){const f=(budget-50)/Math.max(1,sum-50);pts=pts.map(v=>10+Math.floor((v-10)*f))}
      out.push({sp,lv,el,nat,ab,q,g,ap:ap.map(Math.round),sk:skills,ev:e,at:pts});
    }
    return{ok:true,pets:out,hash};
  }catch(e){return{err:'挑战码无法解析，请检查是否完整复制'}}
}
function duelPet(d){
  const p=mk(d.sp,d.lv,d.q);p.ap=d.ap;p.g=d.g;p.el=d.el;p.nat=d.nat;p.ab=d.ab;p.sk=d.sk;p.ev=d.ev;p.at=d.at;p.fp=0;p.loy=100;p.id=-1;
  if(d.ev>0&&EVN[d.sp])p.n=EVN[d.sp][d.ev-1];return p;
}
const FOE_SK_MAP={'必杀':'必杀','吸血':'吸血','反震':'反震','治疗':'治疗','烈火':'群攻','地狱烈火':'群攻','定身':'眩晕'};
function duelFoes(){
  const P=S.duelParsed;if(!P||!P.pets||!P.pets.length)return[0,1,2].map(i=>({lv:1,b:false,n:'等待对手',e:'❔',el:i,hp:1,mx:1,atk:1,def:1,spd:1,sk:[],boss:false,phase:'strike',ri:0,map:'挑战',mech:null}));
  const list=P.pets.slice();while(list.length<3){const base=list[0];list.push({...base,shadow:true})}
  const arr=list.slice(0,3);if(arr.length===3&&arr[1].shadow){const t=arr[1];arr[1]=arr[0];arr[0]=t}
  return arr.map(d=>{const p=duelPet(d),a=stats(p),k=d.shadow?.6:1,sk=[...new Set(p.sk.map(x=>FOE_SK_MAP[x]).filter(Boolean))];
    return{lv:d.lv,b:false,n:(d.shadow?'影子·':'')+p.n,e:emo(p),el:d.el,hp:Math.round(a.hp*k),mx:Math.round(a.hp*k),atk:Math.round(Math.max(a.atk,a.mag*.9)*k),def:Math.round(a.def*k),spd:a.spd,sk,boss:false,phase:'strike',ri:0,map:'挑战',mech:null}});
}

const MS_TRACKS=[{id:'fuse',n:'融合',e:'🔮',at:[3,10,25,50,100]},{id:'cap',n:'捕捉',e:'🌿',at:[10,30,80,150,300]},{id:'boss',n:'击败 Boss',e:'👹',at:[3,10,25,60,120]},{id:'win',n:'战斗胜利',e:'⚔️',at:[20,60,150,400,1000]},{id:'trip',n:'探险归来',e:'🚗',at:[1,5,15,40,100]}];
const MS_REWARDS=[[['coins',300],['gems',5]],[['coins',800],['gems',10]],[['coins',1500],['gems',15],['shard',3]],[['coins',3000],['gems',25],['stone',1]],[['coins',6000],['gems',50],['stone',2]]];
const MS_ICON={coins:'🪙',gems:'💎',shard:'🧩进化石碎片',stone:'🪨进化石'};
const msTier=tr=>{const done=S.ms[tr.id]||[];let t=0;while(t<tr.at.length&&done.includes(t))t++;return t};
const msClaimable=()=>MS_TRACKS.some(tr=>{const t=msTier(tr);return t<tr.at.length&&S.cnt[tr.id]>=tr.at[t]});
function msView(){
  return`<div class="card"><h3>🏁 累计里程碑</h3><div class="sub" style="margin-bottom:6px;line-height:1.6">只看你一共做了多少次，做得越多档位越高，从第3档起可以多选一个奖励。</div>${MS_TRACKS.map(tr=>{
    const t=msTier(tr),c=S.cnt[tr.id]||0;
    if(t>=tr.at.length)return`<div class="at"><span>${tr.e} ${tr.n} <span class="sub">累计 ${c} 次</span></span><span class="tag">全部领取 ✔</span></div>`;

    return`<div style="margin:8px 0"><div class="at"><span>${tr.e} ${tr.n} <span class="sub">第 ${t+1}/${tr.at.length} 档 · ${Math.min(c,tr.at[t])}/${tr.at[t]}</span></span></div>${ready?`<div class="row" style="margin-top:4px">${MS_REWARDS[t].map((r,i)=>`<button class="b" data-a="msclaim" data-v="${tr.id}|${t}|${i}">${MS_ICON[r[0]]}${r[1]}</button>`).join('')}<span class="sub">选一个</span></div>`:`<div class="sub">下一档奖励：${MS_REWARDS[t].map(r=>MS_ICON[r[0]]+r[1]).join(' / ')}${MS_REWARDS[t].length>1?'（选一个）':''}</div>`}</div>`}).join('')}</div>`;
}
function msClaim(v){
  const[id,t,o]=String(v).split('|'),tr=MS_TRACKS.find(x=>x.id===id),ti=+t,oi=+o;
  if(!tr||!Number.isInteger(ti)||ti<0||ti>=tr.at.length)return;
  const done=S.ms[id]=S.ms[id]||[];if(done.includes(ti)||(S.cnt[id]||0)<tr.at[ti])return toast('还没达到这一档');
  const r=MS_REWARDS[ti][oi];if(!r)return;
  done.push(ti);
  if(r[0]=='coins')S.coins+=r[1];else if(r[0]=='gems')S.gems+=r[1];else if(r[0]=='shard'){S.shard+=r[1];while(S.shard>=5){S.shard-=5;S.stone++}}else if(r[0]=='stone')S.stone+=r[1];
  toast('里程碑奖励：'+MS_ICON[r[0]]+r[1]);
}

const captureCost=z=>Math.max(5,Math.round(z.cost/4));
const captureSpecial=e=>!e.caught&&(e.pet.q>0||e.rare);
function initCapture(){
  if(!Number.isInteger(S.zone)||!ZONES[S.zone])S.zone=0;
  const c=S.capture&&typeof S.capture==='object'?S.capture:{};
  const options=c.options||{};
  S.capture={zone:S.zone,batch:[],selected:0,round:0,nextAt:0,tryAt:0,notice:'选择栖息地，探索寻找想要的伙伴。',last:null,...c,options:{baby:options.baby!==false,mutant:options.mutant!==false,rare:options.rare!==false}};
  const state=S.capture;
  if(state.zone!==S.zone||!Array.isArray(state.batch))state.batch=[];
  state.batch=state.batch.filter(e=>e&&e.pet&&SP[e.pet.sp]&&[0,1,2].includes(e.pet.q)&&Number.isInteger(e.pet.id)).slice(0,3);
  state.zone=S.zone;
  state.round=Number.isFinite(state.round)?Math.max(0,Math.floor(state.round)):0;
  state.nextAt=Number.isFinite(state.nextAt)?Math.min(state.nextAt,Date.now()+5000):0;
  state.tryAt=0;
  for(const e of state.batch){S.nid=Math.max(S.nid,e.pet.id+1);if(get(e.pet.id))e.caught=true}
  if(!state.batch.some(e=>e.pet.id===state.selected&&!e.caught))state.selected=0;
  if(!state.last||!SP[state.last.sp]||!Array.isArray(state.last.ap))state.last=null;
  LAST=state.last;
}

function exploreCapture(){

  if(S.coins<captureCost(z)){stopCaptureAuto('金币不足，探索已停止。当前遭遇仍然保留。');return false}
  if(Date.now()<c.nextAt)return false;

function foes(st){
  const e=enemy(st),b=e.b,m=1+.7*S.ng;
  return[0,1,2].map(i=>{
    const bb=b&&i==1,mo=MON[(st+i)%5],k=b?(bb?1:.5):.85,ak=b?(bb?1:.6):.85,f={...e,n:bb?e.n:mo[1],e:bb?e.e:mo[0],el:b?e.el:(e.el+(i==2?2:0))%5};
    f.hp=f.mx=Math.round(e.hp*k*m);f.atk=Math.round(e.atk*ak*m);f.def=Math.round(e.def*(b&&!bb?.6:1)*m);
    const n=b?1:Math.min(3,(st<3?0:st<10?1:2)+S.ng);
    f.boss=bb;f.phase='strike';f.mech=bb?MECH_IDS[e.ri]:null;f.shield=f.mech=='shield';f.sk=bb?GSK[e.ri].slice():Array.from({length:n},(_,j)=>FSK[(st*3+i*2+j*5)%6]);return f}).map(f=>b?applyWeekRule(f):f);
}

const canCast=(t,c)=>!!CAST[c]&&t.p.sk.includes(CAST[c].skill)&&t.mp>=CAST[c].cost;
function autoPick(t){
  const enemies=alive(B.F),allies=alive(B.T);if(!enemies.length)return;
  const focus=enemies.slice().sort((x,y)=>x.hp-y.hp)[0],danger=enemies.find(f=>f.boss&&f.phase=='burst'&&!f.stun);
  const injured=allies.slice().sort((x,y)=>x.hp/x.mx-y.hp/y.mx)[0];
  t.cmd='a';t.tg=B.F.indexOf(focus);
  const useMeds=S.autoPotion&&!(potionBan());
  const needPotion=allies.filter(x=>x.hp*100<=x.mx*S.potionRules.red&&!B.T.some(y=>y.hp>0&&y.cmd=='h'&&B.T[y.tg]===x)).sort((x,y)=>x.hp/x.mx-y.hp/y.mx)[0];
  if(useMeds&&S.potionRules.red>0&&medicineLeft('h')>0&&needPotion){
    const missing=needPotion.mx-needPotion.hp;
    t.cmd=canCast(t,'heal')&&Math.min(missing,healingAmount(needPotion))>=Math.min(missing,RECOVERY.red)?'heal':'h';
    t.tg=B.T.indexOf(needPotion);return;
  }
  if(canCast(t,'heal')&&injured.hp<injured.mx*.5){t.cmd='heal';t.tg=B.T.indexOf(injured);return}
  if(danger){
    if(canCast(t,'seal')&&!(danger.controlImmuneUntil>=B.r+1)){t.cmd='seal';t.tg=B.F.indexOf(danger);return}
    if(canCast(t,'buff')&&allies.some(x=>!(x.guardUntil>=B.r+1))){t.cmd='buff';return}
    if(danger.hp>t.a.atk*.8){t.cmd='d';return}
    t.tg=B.F.indexOf(danger);t.cmd=canCast(t,'m')?'m':'a';return;
  }
  const learned=Object.values(CAST).filter(s=>t.p.sk.includes(s.skill));
  if(useMeds&&S.potionRules.blue>0&&medicineLeft('u')>0&&learned.length&&t.mp*100<=t.mm*S.potionRules.blue){t.cmd='u';t.tg=B.T.indexOf(t);return}
  const taunter=allies.find(x=>x.tauntUntil>=B.r+1||x.cmd=='taunt');
  if(canCast(t,'taunt')&&allies.length>1&&t.hp>=t.mx*.5&&!taunter){t.cmd='taunt';return}
  if(taunter===t&&t.hp<t.mx*.6){t.cmd='d';return}
  if(canCast(t,'buff')&&allies.length>1&&allies.some(x=>x.hp<x.mx*.8)&&allies.some(x=>!(x.guardUntil>=B.r+1))){t.cmd='buff';return}
  if(canCast(t,'seal')){const target=enemies.find(f=>!f.stun&&!(f.controlImmuneUntil>=B.r+1)&&f.hp>t.a.atk*1.5);if(target){t.cmd='seal';t.tg=B.F.indexOf(target);return}}
  if(canCast(t,'g')&&enemies.length>=2){t.cmd='g';return}
  if(canCast(t,'m')&&(t.a.mag*1.8>t.a.atk||focus.hp>t.a.atk)){t.cmd='m';return}
  if(canCast(t,'heal')&&injured.hp<injured.mx*.75){t.cmd='heal';t.tg=B.T.indexOf(injured)}
}
function autoRun(){
  if(AUTO_TIMER)clearInterval(AUTO_TIMER);if(!B.run||document.hidden)return;B.auto=1;B.pend=null;
  AUTO_TIMER=setInterval(()=>{
    if(!B.run||!B.auto||document.hidden){stopAutoRun();return}
    if(B.resolving||Date.now()<(B.nextRoundAt||0))return;
    B.T.forEach(t=>{if(t.hp>0&&!t.cmd)autoPick(t)});resolve();
  },500);
}
function bpick(c){
  if(!B.run||B.auto||B.resolving)return;
  const t=B.T[B.pi];if(!t||t.hp<=0)return;
  if(c=='x'){B.pend=null;render();return}
  if(!['a','d',...Object.keys(MEDICINE),...Object.keys(CAST)].includes(c))return;
  if(CAST[c]&&!t.p.sk.includes(CAST[c].skill))return toast('未学会'+CAST[c].skill);
  if(CAST[c]&&t.mp<CAST[c].cost)return toast('魔法不足，普攻回复4点，防御回复8点');
  if(MEDICINE[c]&&potionBan())return toast('本周规则：禁药周（Boss、悬赏、塔内禁用红药和蓝药）');
  if(MEDICINE[c]&&medicineLeft(c)<1)return toast('没有可用的'+ITEMS[MEDICINE[c]].n+'（已选指令会预留道具）');
  if(MEDICINE[c]&&!B.T.some(x=>medicineNeeded(c,x)))return toast(c=='h'?'队友气血已满':'队友魔法已满');
  if(targetSide(c)=='enemy'||targetSide(c)=='ally'){B.pend=c;render();return}
  commit(c,0);
}
function btgt(i,side='enemy'){
  if(!B.run||B.auto||B.resolving||!B.pend||targetSide(B.pend)!=side)return;
  const target=(side=='ally'?B.T:B.F)[i];if(!target||target.hp<=0)return;
  if(MEDICINE[B.pend]&&!medicineNeeded(B.pend,target))return toast(B.pend=='h'?'该宠物气血已满':'该宠物魔法已满');
  if(MEDICINE[B.pend]&&!medicineLeft(B.pend))return toast('道具已被其他指令预留');
  commit(B.pend,+i);
}
function commit(c,tg){
  if(!B.run||B.resolving)return;
  const t=B.T[B.pi];t.cmd=c;t.tg=tg;B.pend=null;
  const n=nxt(B.pi+1);if(n<0)resolve();else{B.pi=n;render()}
}
function restoreMana(t,n){const h=Math.min(n,t.mm-t.mp);t.mp+=h;return h}
const healingAmount=t=>Math.max(1,Math.round(t.mx*RECOVERY.heal));
function healPet(t,n){const h=Math.max(0,Math.min(Math.round(n),t.mx-t.hp));if(t.hp<=0)return 0;t.hp+=h;return h}
function hurtPet(t,d){
  if(t.hp<=0)return 0;const actual=Math.min(t.hp,d);t.hp=Math.max(0,t.hp-d);
  if(t.hp>0)return actual;
  if(t.p.ab==2&&!t.used){t.hp=1;t.used=1;LOGL.push(t.p.n+'发动不屈，保留1点气血');return actual}
  t.tauntUntil=0;
  if(t.p.sk.includes('神佑')&&!t.reviveUsed){
    t.reviveUsed=1;
    if(Math.random()<.3){t.hp=Math.max(1,Math.round(t.mx*.4));t.stun=0;t.revivedRound=B.r;LOGL.push(t.p.n+'触发神佑！复活并恢复'+t.hp+'气血');return actual}
    LOGL.push(t.p.n+'神佑未触发');
  }
  LOGL.push('　'+t.p.n+'倒下');return actual;

function hurtFoe(f,d,t,physical){

function resolve(){

  B.F.forEach(f=>{if(f.hp>0)acts.push({f,spd:f.spd+R(0,3)})});

function playBattleStep(){

  if(playback.phase=='complete'){playback.index++;playback.phase='prepare'}
  if(playback.phase=='prepare'){
    while(playback.index<playback.acts.length&&(playback.acts[playback.index].t||playback.acts[playback.index].f).hp<=0)playback.index++;
    if(playback.index>=playback.acts.length||!alive(B.F).length||!alive(B.T).length){finishBattleRound();return}
    const action=playback.acts[playback.index],unit=action.t||action.f;
    B.fx={actor:unit,title:(action.t?unit.p.n:unit.n)+' · '+actionLabel(action),lines:['准备出手…'],changes:[],special:actionLabel(action)=='蓄力群攻'};

  const action=playback.acts[playback.index],units=[...B.T,...B.F],before=units.map(unit=>unit.hp),start=LOGL.length;

  else{B.T.forEach(t=>t.p.loy=Math.max(0,t.p.loy-10));LOGL.push('💀 全员倒下，忠诚度 -10')}
  if(win&&!B.rogue&&!B.duel)grantBattleLoot(loot);

}

  }
  else if(a=='ad'){toast('广告播放中… (演示)');setTimeout(()=>{S.coins+=100;save();render();toast('奖励 +100🪙')},1500);return}
  else if(a=='daily'){const d=new Date().toDateString();if(S.day===d)return toast('今天已领取');S.day=d;S.gems+=10;toast('+10💎')}
  else if(a=='iap'){S.gems+=60;toast('演示：+60💎 (真实内购需接入支付SDK)')}
  else if(a=='reset'){
    if(!window.confirm('确定要重置存档吗？\n\n所有宠物、背包道具、金币、钻石和关卡进度都将清空，此操作无法撤销。\n\n点击“取消”保留存档。'))return;

  }
  save();render();
  if(a=='fuse'&&FUSION_RESULT_OPEN)$('fusion-result')?.scrollIntoView({block:'start',behavior:'smooth'});
  if(a=='cap'&&S.capture.last?.id===Number(String(v).split(',')[0]))$('main').querySelector('.capture-result')?.scrollIntoView({block:'start',behavior:'smooth'});
}
