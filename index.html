const alive=a=>a.filter(x=>x.hp>0),nxt=i=>{for(;i<B.T.length;i++)if(B.T[i].hp>0)return i;return -1};

const canCast=(t,c)=>!!CAST[c]&&t.p.sk.includes(CAST[c].skill)&&t.mp>=CAST[c].cost;
function autoPick(t){
  const enemies=alive(B.F),allies=alive(B.T);if(!enemies.length)return;
  const focus=enemies.slice().sort((x,y)=>x.hp-y.hp)[0],danger=enemies.find(f=>f.boss&&f.phase=='burst'&&!f.stun);
  const injured=allies.slice().sort((x,y)=>x.hp/x.mx-y.hp/y.mx)[0];
  t.cmd='a';t.tg=B.F.indexOf(focus);
  const useMeds=S.autoPotion&&!(B.tw&&wrule()==1);
  const needPotion=allies.filter(x=>x.hp*100<=x.mx*S.potionRules.red&&!B.T.some(y=>y.hp>0&&y.cmd=='h'&&B.T[y.tg]===x)).sort((x,y)=>x.hp/x.mx-y.hp/y.mx)[0];
  if(useMeds&&S.potionRules.red>0&&medicineLeft('h')>0&&needPotion){t.cmd='h';t.tg=B.T.indexOf(needPotion);return}
  if(canCast(t,'heal')&&injured.hp<injured.mx*.5){t.cmd='heal';t.tg=B.T.indexOf(injured);return}
  if(danger){
    if(canCast(t,'seal')&&!(danger.controlImmuneUntil>=B.r+1)){t.cmd='seal';t.tg=B.F.indexOf(danger);return}
    if(canCast(t,'buff')&&allies.some(x=>!(x.guardUntil>=B.r+1))){t.cmd='buff';return}
    if(danger.hp>t.a.atk*.8){t.cmd='d';return}
    t.tg=B.F.indexOf(danger);t.cmd=canCast(t,'m')?'m':'a';return;
  }
  const learned=Object.values(CAST).filter(s=>t.p.sk.includes(s.skill));
  if(useMeds&&S.potionRules.blue>0&&medicineLeft('u')>0&&learned.length&&t.mp*100<=t.mm*S.potionRules.blue){t.cmd='u';t.tg=B.T.indexOf(t);return}
  if(canCast(t,'buff')&&allies.length>1&&allies.some(x=>x.hp<x.mx*.8)&&allies.some(x=>!(x.guardUntil>=B.r+1))){t.cmd='buff';return}
  if(canCast(t,'seal')){const target=enemies.find(f=>!f.stun&&!(f.controlImmuneUntil>=B.r+1)&&f.hp>t.a.atk*1.5);if(target){t.cmd='seal';t.tg=B.F.indexOf(target);return}}
  if(canCast(t,'g')&&enemies.length>=2){t.cmd='g';return}
  if(canCast(t,'m')&&(t.a.mag*1.8>t.a.atk||focus.hp>t.a.atk)){t.cmd='m';return}
  if(canCast(t,'heal')&&injured.hp<injured.mx*.75){t.cmd='heal';t.tg=B.T.indexOf(injured)}
}
function autoRun(){
  if(AUTO_TIMER)clearInterval(AUTO_TIMER);if(!B.run||document.hidden)return;B.auto=1;B.pend=null;
  AUTO_TIMER=setInterval(()=>{
    if(!B.run||!B.auto||document.hidden){stopAutoRun();return}
    B.T.forEach(t=>{if(t.hp>0&&!t.cmd)autoPick(t)});resolve();
  },500);
}
function bpick(c){
  if(!B.run||B.auto)return;
  const t=B.T[B.pi];if(!t||t.hp<=0)return;
  if(c=='x'){B.pend=null;render();return}
  if(!['a','d',...Object.keys(MEDICINE),...Object.keys(CAST)].includes(c))return;
  if(CAST[c]&&!t.p.sk.includes(CAST[c].skill))return toast('未学会'+CAST[c].skill);
  if(CAST[c]&&t.mp<CAST[c].cost)return toast('魔法不足，普攻回复4点，防御回复8点');
  if(MEDICINE[c]&&B.tw&&wrule()==1)return toast('本周规则：塔内禁用红药和蓝药');
  if(MEDICINE[c]&&medicineLeft(c)<1)return toast('没有可用的'+ITEMS[MEDICINE[c]].n+'（已选指令会预留道具）');
  if(MEDICINE[c]&&!B.T.some(x=>medicineNeeded(c,x)))return toast(c=='h'?'队友气血已满':'队友魔法已满');
  if(targetSide(c)=='enemy'||targetSide(c)=='ally'){B.pend=c;render();return}
  commit(c,0);
}
function btgt(i,side='enemy'){
  if(!B.run||B.auto||!B.pend||targetSide(B.pend)!=side)return;
  const target=(side=='ally'?B.T:B.F)[i];if(!target||target.hp<=0)return;
  if(MEDICINE[B.pend]&&!medicineNeeded(B.pend,target))return toast(B.pend=='h'?'该宠物气血已满':'该宠物魔法已满');

function restoreMana(t,n){const h=Math.min(n,t.mm-t.mp);t.mp+=h;return h}
function healPet(t,n){const h=Math.max(0,Math.min(Math.round(n),t.mx-t.hp));if(t.hp<=0)return 0;t.hp+=h;return h}
function hurtPet(t,d){
  if(t.hp<=0)return 0;const actual=Math.min(t.hp,d);t.hp=Math.max(0,t.hp-d);

    LOGL.push(t.p.n+'神佑未触发');

function hurtFoe(f,d,t,physical){

}
function pAct(t){

    const id=MEDICINE[t.cmd],target=B.T[t.tg];

  }

    else{
      t.mp-=cast.cost;L.push(p.n+'施放'+cast.skill+'，消耗'+cast.cost+'魔法');
      if(t.cmd=='heal'){
        let ally=B.T[t.tg];if(!ally||ally.hp<=0)ally=alive(B.T).sort((x,y)=>x.hp/x.mx-y.hp/y.mx)[0];
        L.push('　'+ally.p.n+'恢复'+healPet(ally,a.mag*1.1+ally.mx*.1)+'气血');return;
      }
      if(t.cmd=='buff'){alive(B.T).forEach(x=>x.guardUntil=B.r+1);L.push('　全队获得护佑：本回合及下回合减伤25%');return}
      let f=B.F[t.tg];if(!f||f.hp<=0)f=al.slice().sort((x,y)=>x.hp-y.hp)[0];
      if(t.cmd=='seal'){
        if(f.controlImmuneUntil>=B.r||f.stun){L.push('　'+f.n+'暂时免疫定身');return}
        if(Math.random()<(f.boss?.45:.75)){f.stun=1;if(f.phase=='burst'){f.phase='strike';L.push('　打断'+f.n+'的蓄力！')}L.push('　'+f.n+'被定身，跳过下一次行动')}
        else L.push('　'+f.n+'抵抗了定身');return;

  let d=Math.max(1,Math.round((a.atk-f.def*(p.ab==4?.4:.6))*em*bf*R(.9,1.1))),tx='攻击';
  if(has('必杀')&&Math.random()<.25){d*=2;tx='必杀暴击'}
  L.push(p.n+tx+f.n+'，'+d+'伤害'+(em>1?'（克制）':em<1?'（被克）':'')+'，魔法+'+restoreMana(t,4));

  if(t.hp>0&&t.revivedRound!==B.r&&has('连击')&&f.hp>0&&Math.random()<.4){const d2=Math.max(1,Math.round(d*.6));L.push('连击！追加'+d2);const hit=hurtFoe(f,d2,t,true);if(has('吸血')&&t.hp>0)L.push('　吸血恢复'+healPet(t,hit*.3))}
}
function fAct(f){

    let d=Math.max(1,Math.round(Math.max(1,atk-t.a.def*.6)*em*R(.9,1.1)*(t.df?.5:1)*(guard?.75:1)*(p.ab==3?.88:1)*(weak?1.2:1)*mul)),tx=tag||'攻击';
    if(!burst&&has('必杀')&&Math.random()<.2){d=Math.round(d*1.8);tx='必杀'}

    const actual=hurtPet(t,d);

    if(!burst&&has('眩晕')&&t.hp>0&&t.revivedRound!==B.r&&!(t.stunImmuneUntil>=B.r)&&Math.random()<.25){t.stun=1;LOGL.push('　'+p.n+'被眩晕！')}

function endCheck(){if(!alive(B.F).length){bend(1);return 1}if(!alive(B.T).length){bend(0);return 1}return 0}
function resolve(){
  LOGL.push('— 第'+(++B.r)+'回合 —');

    t.df=t.cmd=='d'&&!t.stun;
    if(t.hp>0&&t.p.sk.includes('再生')){const h=healPet(t,Math.max(1,Math.round(t.mx*.05)));if(h)LOGL.push(t.p.n+'再生恢复'+h)}

  B.F.forEach(f=>{if(f.hp>0)acts.push({f,spd:f.spd+R(0,3)})});
  acts.sort((x,y)=>y.spd-x.spd);
  for(const x of acts){if(!alive(B.F).length||!alive(B.T).length)break;x.t?pAct(x.t):fAct(x.f)}

    const q=Math.max(x.q,y.q,1),n=mk(pick([x.sp,y.sp]),1,q);n.el=pick([x.el,y.el]);n.nat=pick([x.nat,y.nat]);n.ab=pick([x.ab,y.ab]);
    n.ap=x.ap.map((v,i)=>Math.round((v+y.ap[i])/2*R(.98,1.08)));
    n.g=+Math.min(1.5,(x.g+y.g)/2+R(0,.06)).toFixed(3);
    const allowedWeak=WEAK_SP.includes(n.sp)?weakFor(n.el):null,pool=[...new Set([...x.sk,...y.sk].filter(k=>!BADSK.includes(k)||k===allowedWeak))];for(let i=pool.length-1;i>0;i--){const j=RI(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}
    const sk=pool.filter(k=>Math.random()<(x.sk.includes(k)&&y.sk.includes(k)?.8:.5));
    let resonance=false;
    if(Math.random()<.3){const missing=pool.filter(k=>!sk.includes(k)),extra=Math.min(2,slots(n)-sk.length,missing.length);for(let i=0;i<extra;i++){sk.push(missing[i]);resonance=true}}
    const inherited=Math.min(sk.length,slots(n));
    if(sk.length<slots(n)&&Math.random()<.15){const fresh=SKN.filter(k=>!sk.includes(k));if(fresh.length)sk.push(pick(fresh))}
    n.sk=sk.slice(0,slots(n));
    S.pets=S.pets.filter(q=>q.id!==x.id&&q.id!==y.id);S.pets.push(n);dx(n);
    S.team=S.team.filter(x=>get(x));if(!S.team.length)S.team=[n.id];S.active=S.team[0];S.sel=n.id;S.mg=[];qp('fuse');LAST=n;S.tab='pets';toast('炼化成功: '+n.n+'，继承'+inherited+'个技能'+(resonance?' · 技能共鸣！':''));
  }
  else if(a=='ad'){toast('广告播放中… (演示)');setTimeout(()=>{S.coins+=100;save();render();toast('奖励 +100🪙')},1500);return}
  else if(a=='daily'){const d=new Date().toDateString();if(S.day===d)return toast('今天已领取');S.day=d;S.gems+=10;toast('+10💎')}
  else if(a=='iap'){S.gems+=60;toast('演示：+60💎 (真实内购需接入支付SDK)')}
  else if(a=='reset'){
    if(!window.confirm('确定要重置存档吗？\n\n所有宠物、背包道具、金币、钻石和关卡进度都将清空，此操作无法撤销。\n\n点击“取消”保留存档。'))return;
    try{localStorage.removeItem('petsaga2')}catch(e){toast('重置失败，存档未清空，请稍后重试');return}
    location.reload();return;
  }
  save();render();
}

  const hadLegacy=p.sk.some(k=>OLD_BADSK.includes(k));p.sk=p.sk.filter(k=>!OLD_BADSK.includes(k));

if(!S.pets.length){for(let i=0;i<3;i++)S.pets.push(mk((i*2+RI(0,1))%6,5,i?0:1));S.active=S.sel=S.pets[0].id;S.team=S.pets.map(x=>x.id)}
if(!S.team||!S.team.length)S.team=[S.active];S.team=S.team.filter(x=>get(x));if(!S.team.length)S.team=[S.pets[0].id];S.active=S.team[0];
dqRoll();S.pets.forEach(dx);if(!get(S.sel))S.sel=S.pets[0].id;if(S.mode!='main')S.farmOn=false;
